name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core
          npm run build

      - name: Initialize Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Mobile Hymnal" "com.hymnal.hiligaynon" --web-dir dist
          fi

      - name: Add or Sync Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Set Android app metadata
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 10101/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.1.1"/' android/app/build.gradle

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-hymnal-1.1.1-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
